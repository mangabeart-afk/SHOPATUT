<!doctype html>
<html lang="it">
<head>

  <title>MangaBEART · Offline</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fdfbf7; color: #302625; }

    p { margin: 0; line-height: 1.6; }
    button { margin-top: 22px; border: 0; border-radius: 10px; padding: 12px 18px; color: #fff; background: #703834; font: inherit; font-weight: 650; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>MangaBEART</h1>
    <p>La connessione non è disponibile. Quando torni online, ricarica la pagina per vedere i dati aggiornati.</p>
